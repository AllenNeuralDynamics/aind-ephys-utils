name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  # requires-python, the classifiers and the matrix below all state which
  # Pythons are supported, and nothing else keeps them in step.
  python-versions:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.12'
    - name: Version declarations agree
      run: python .github/scripts/check_python_versions.py

  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Floor and ceiling only.  The package is pure Python
        # (py3-none-any, no compiled artifacts), so the interesting
        # failures are old-syntax at the floor and deprecation removals
        # at the ceiling; the versions between re-run the same code on
        # the same semantics.
        python-version: [ '3.10', '3.14' ]
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install -e .[dev] numba
    - name: Run linter checks
      run: flake8 . && interrogate .
    - name: Run tests and coverage
      run: coverage run -m unittest discover && coverage report
